<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>js-test</title>

        <link rel="stylesheet" href="style.css">
        <script src="get-theme.js"></script>
    </head>

        <div class="theme-btn-container">
            <button class="theme-btn"></button>
        </div>
        <div class="poeng-container-container">

                <p class="poeng-a">0</p>
                <div class="poeng-btn-container">

                    <button class="poeng-btn poeng-btn-minus-a">-</button>
                    <button class="poeng-btn poeng-btn-reset-a">Reset</button>
                </div>
            </div>
            <div class="poeng-container">
                <p class="poeng-b">0</p>
                <div class="poeng-btn-container">
                    <button class="poeng-btn poeng-btn-plus-b">+</button>
                    <button class="poeng-btn poeng-btn-minus-b">-</button>
                    <button class="poeng-btn poeng-btn-reset-b">Reset</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
